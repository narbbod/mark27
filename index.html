<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Mark</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0b0f17;
    color: #8aa0b5;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 10px;
}

h1 {
    text-align: center;
    font-size: 14px;
    letter-spacing: 1px;
    color: #b9d6ff;
}

.nav {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

button {
    flex: 1;
    padding: 8px;
    border: 1px solid #2a3a4d;
    background: #121826;
    color: #c7d8ea;
    border-radius: 6px;
    font-size: 11px;
}

button:active {
    background: #1b2535;
}

.section {
    display: none;
}

.active {
    display: block;
}

.card {
    border: 1px solid #1f2a38;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 8px;
    background: #121826;
}

.grid {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 4px;
    align-items: center;
    border-left: 1px solid #1f2a38;
    padding-left: 4px;
}

input {
    width: 100%;
    height: 28px;
    padding: 0;
    font-size: 11px;
    text-align: center;
    border: 1px solid #2a3a4d;
    border-radius: 5px;
    background: #0b0f17;
    color: #d6e2f0;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    border-color: #4a6fa5;
}

input:disabled {
    opacity: 0.5;
}

/* alineación perfecta */
.grid input:first-child {
    width: 30px;
    min-width: 30px;
    max-width: 30px;
}

.grid input:nth-child(2n) {
    width: 100%;
}

.total {
    font-size: 12px;
    text-align: center;
    font-weight: 600;
    color: #d6e2f0;
}

.cuentas input {
    margin: 3px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>META MARK</h1>

<div class="nav">
    <button onclick="mostrar('meta')">META</button>
    <button onclick="mostrar('cuentas')">CUENTAS</button>
</div>

<!-- META -->
<div id="meta" class="section active">

    <div class="card">
        <div class="grid" id="metaGrid"></div>
    </div>

    <div class="card total" id="resultado">TOTAL: 0</div>

</div>

<!-- CUENTAS -->
<div id="cuentas" class="section cuentas">

    <div class="card total">PRESUPUESTO: <span id="presupuesto">0</span></div>

    <div class="card total">GASTOS: 1078</div>

    <div class="card total">TOTAL DE GASTOS: <span id="totalGastos">0</span></div>

    <div class="card total">CAMBIO: <span id="cambio">0</span></div>

    <div class="card">
        VEHICULO <input value="15000000">
        3 MESES DE ARRIENDO <input value="2400000">
        MERCADO PARA LOS 3 MESES <input value="1500000">
        BASE CAMA <input value="600000">
        NEVERA APARTAMENTERA <input value="400000">
        IMPLEMENTOS DE COSINA <input value="500000">
    </div>

    <div class="card total">
        FONDO DE EMERGENCIA: <span id="fondo">0</span>
    </div>

</div>

</div>

<script>
function mostrar(seccion) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(seccion).classList.add('active');
}

// META
const grid = document.getElementById("metaGrid");

for (let i = 1; i <= 50; i++) {
    let num = document.createElement("input");
    num.value = i;
    num.disabled = true;

    let val = document.createElement("input");
    val.value = 714;
    val.oninput = calcular;

    grid.appendChild(num);
    grid.appendChild(val);
}

// CALCULO
function calcular() {
    let inputs = document.querySelectorAll("#metaGrid input:nth-child(2n)");
    let total = 0;

    inputs.forEach(i => total += Number(i.value));

    document.getElementById("resultado").innerText = "TOTAL: " + total;

    document.getElementById("presupuesto").innerText = total;

    calcularCuentas(total);
}

function calcularCuentas(presupuesto) {
    let gastos = 15000000 + 2400000 + 1500000 + 600000 + 400000 + 500000;

    document.getElementById("totalGastos").innerText = gastos;

    let cambio = presupuesto - gastos;
    document.getElementById("cambio").innerText = cambio;

    document.getElementById("fondo").innerText = cambio;
}

calcular();
</script>

</body>
</html>
